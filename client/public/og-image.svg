<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D1510"/>
      <stop offset="60%" stop-color="#1F0D09"/>
      <stop offset="100%" stop-color="#140806"/>
    </linearGradient>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2E2CC"/>
      <stop offset="50%" stop-color="#E0C8A8"/>
      <stop offset="100%" stop-color="#C9A07A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%"   stop-color="#C9A07A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C9A07A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Ambient glow -->
  <ellipse cx="600" cy="265" rx="400" ry="260" fill="url(#glow)"/>

  <!--
    Mark: scale 8 from 40×40 viewBox → 320×320 px content
    Horizontal centre: (1200 - 320) / 2 = 440
    Vertical: leave room for text at bottom; centre mark in top 70%
    y offset: (630×0.70 - 320) / 2 = (441 - 320) / 2 = 60.5 → 60
  -->
  <g transform="translate(440,60) scale(8)" fill="none">
    <path d="M9,8 L13,8  M11,8 L11,33 L20,33"
      stroke="url(#mk)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31,8 L27,8  M29,8 L29,33 L20,33"
      stroke="url(#mk)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20,21 C16,17 12,13.5 12,10 C12,7 15,6 20,11.5 C25,6 28,7 28,10 C28,13.5 24,17 20,21Z"
      fill="url(#mk)"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="488"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72" font-weight="400" letter-spacing="20"
    fill="url(#mk)">LULOU</text>

  <!-- Tagline -->
  <text x="600" y="546"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24" letter-spacing="7"
    fill="#C9A07A" opacity="0.65">INTENTIONAL DATING</text>
</svg>
