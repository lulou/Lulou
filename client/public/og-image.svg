<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FDF0F2"/>
      <stop offset="100%" stop-color="#F5D8DC"/>
    </linearGradient>
    <linearGradient id="ltr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#CB8A94"/>
      <stop offset="50%"  stop-color="#B86E7A"/>
      <stop offset="100%" stop-color="#C98894"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Mark centred, scale 5.5 from 100×100 viewBox → ~88×88 content = 484×484 -->
