    <path d="M47,65 C41,59 35,53 35,48 C35,43 39,41 47,51 C55,41 59,43 59,48 C59,53 53,59 47,65Z"
      fill="none" stroke="url(#ltr)" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="548"
    text-anchor="middle"
    font-family="Georgia,'Times New Roman',serif"
    font-size="72" font-weight="400" letter-spacing="18"
