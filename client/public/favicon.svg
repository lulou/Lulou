<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D1510"/>
      <stop offset="100%" stop-color="#180A06"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="40" height="40" rx="9" fill="url(#bg)"/>
  <!-- Left L — serif cap, vertical, foot to centre -->
  <path d="M9,8 L13,8  M11,8 L11,33 L20,33"
    stroke="#EDD8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right L — mirrored -->
  <path d="M31,8 L27,8  M29,8 L29,33 L20,33"
    stroke="#EDD8BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Heart -->
  <path d="M20,21 C16,17 12,13.5 12,10 C12,7 15,6 20,11.5 C25,6 28,7 28,10 C28,13.5 24,17 20,21Z"
    fill="#EDD8BC"/>
</svg>
