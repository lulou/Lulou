<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D1510"/>
      <stop offset="100%" stop-color="#180A06"/>
    </linearGradient>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2E2CC"/>
      <stop offset="50%" stop-color="#E8D0B0"/>
      <stop offset="100%" stop-color="#C9A07A"/>
    </linearGradient>
  </defs>
  <!-- iOS-style rounded-square background -->
  <rect width="1000" height="1000" rx="220" fill="url(#bg)"/>
  <!-- LL Heart mark — scaled and centered in the icon -->
  <!-- Source viewBox: 40×40, target area: ~640×640 centered in 1000×1000 -->
  <!-- Scale: 640/40 = 16 | Offset: (1000-640)/2 = 180 -->
  <g fill="url(#mk)" transform="translate(180,180) scale(16)">
    <!-- Left L — vertical stroke -->
    <rect x="4"    y="4" width="6.5" height="27" rx="1.5"/>
    <!-- Left L — horizontal foot -->
    <rect x="4"    y="26" width="15"  height="7"  rx="1.5"/>
    <!-- Right L — vertical stroke -->
    <rect x="29.5" y="4" width="6.5" height="27" rx="1.5"/>
    <!-- Right L — horizontal foot -->
    <rect x="21"   y="26" width="15"  height="7"  rx="1.5"/>
    <!-- Heart -->
    <path d="M20,23 C14,19 9,15 9,10 C9,6 13,4 20,13 C27,4 31,6 31,10 C31,15 26,19 20,23Z"/>
  </g>
</svg>
