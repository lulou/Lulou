<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D1510"/>
      <stop offset="100%" stop-color="#180A06"/>
    </linearGradient>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2E2CC"/>
      <stop offset="50%" stop-color="#E8D0B0"/>
      <stop offset="100%" stop-color="#C9A07A"/>
    </linearGradient>
  </defs>

  <!-- iOS-style rounded-square background -->
  <rect width="1000" height="1000" rx="220" fill="url(#bg)"/>

  <!--
    Mark scaled from the 40×40 viewBox.
    Scale = 20  →  40 × 20 = 800 px content
    Offset = (1000 - 800) / 2 = 100 on each side
    transform="translate(100,100) scale(20)"
  -->
  <g transform="translate(100,100) scale(20)" fill="none">
    <!-- Left L — serif + vertical + foot -->
    <path d="M9,8 L13,8  M11,8 L11,33 L20,33"
      stroke="url(#mk)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right L — mirror -->
    <path d="M31,8 L27,8  M29,8 L29,33 L20,33"
      stroke="url(#mk)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Heart -->
    <path d="M20,21 C16,17 12,13.5 12,10 C12,7 15,6 20,11.5 C25,6 28,7 28,10 C28,13.5 24,17 20,21Z"
      fill="url(#mk)"/>
  </g>
</svg>
