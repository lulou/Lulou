  </head>
  <body>
    <div id="root">
      <div id="lulou-boot-shell" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf8f5;padding:24px;font-family:system-ui,sans-serif;color:#2d2225">
        <div style="text-align:center">
          <div style="font-family:Georgia,serif;font-size:28px;font-weight:700;letter-spacing:.01em">Lulou</div>
          <div style="margin-top:10px;font-size:13px;color:#806b70">Loading…</div>
        </div>
      </div>
    </div>

    <!--
      Pre-module boot recovery. This is deliberately plain JavaScript so it runs
      before the app bundle and can recover when that bundle never executes.
    -->
    <script>
      (function () {
        var recoveryKey = "lulou_boot_recovery_attempted";
        var bootTimeoutMs = 20000;

        function bootIsPending() {
          return !!document.getElementById("lulou-boot-shell");
        }

        function showCrash(msg) {
          var root = document.getElementById("root");
          if (!root) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'background:#faf8f5;padding:24px;font-family:system-ui,sans-serif;">' +
            '<div style="max-width:480px;text-align:center;">' +
            '<div style="width:56px;height:56px;border-radius:50%;background:#fee2e2;' +
            'display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">' +
            '<svg width="24" height="24" fill="none" stroke="#dc2626" stroke-width="2" ' +
            'viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/>' +
            '<line x1="12" y1="8" x2="12" y2="12"/>' +
            '<line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>' +
            '<h1 style="font-size:18px;font-weight:600;color:#1a1a1a;margin:0 0 12px">Lulou failed to start</h1>' +
            '<p style="font-size:14px;color:#555;line-height:1.6;margin:0 0 8px;word-break:break-word;">' +
            (msg || "An unexpected error occurred.") +
            '</p>' +
            '<p style="font-size:12px;color:#888;margin:0 0 20px">Your account and preferences are safe.</p>' +
            '<button onclick="window.__lulouBootRetry()" ' +
            'style="padding:10px 24px;border-radius:8px;background:#be4b61;color:white;' +
            'border:none;cursor:pointer;font-size:14px;font-weight:500">Try again</button>' +
            '</div></div>';
        }

        function clearLulouCaches() {
          if (!("caches" in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(keys
              .filter(function (key) { return key.indexOf("lulou-") === 0; })
              .map(function (key) { return caches.delete(key); }));
          });
        }

        function updateWorker() {
          if (!("serviceWorker" in navigator)) return Promise.resolve();
          return navigator.serviceWorker.getRegistration()
            .then(function (registration) {
              return registration ? registration.update() : undefined;
            })
            .catch(function () {});
        }

        function reloadFresh() {
          var url = new URL(location.href);
          url.searchParams.set("boot-recovery", "1");
          url.searchParams.set("v", String(Date.now()));
          location.replace(url.toString());
        }

        function recoverOnce(reason) {
          if (!bootIsPending()) return;
          var attempted = false;
          try {
            attempted = sessionStorage.getItem(recoveryKey) === "1";
            if (!attempted) sessionStorage.setItem(recoveryKey, "1");
          } catch (_) {}
          console.error("[BOOT] pre-react failure", { category: reason, recoveryAttempted: attempted });
          if (attempted) {
            showCrash("Lulou couldn’t finish loading.");
            return;
          }
          Promise.all([updateWorker(), clearLulouCaches()])
            .then(reloadFresh)
            .catch(function () { showCrash("Lulou couldn’t finish loading."); });
        }

        window.__lulouBootRetry = function () {
          try { sessionStorage.removeItem(recoveryKey); } catch (_) {}
          Promise.all([updateWorker(), clearLulouCaches()])
            .then(reloadFresh)
            .catch(reloadFresh);
        };

        // A successful React commit replaces the shell. Reset the one-shot guard
        // only then, so a later app update in the same installed-PWA session can
        // perform its own single recovery.
        var root = document.getElementById("root");
        if (root && "MutationObserver" in window) {
          new MutationObserver(function (_, observer) {
            if (!bootIsPending()) {
              try { sessionStorage.removeItem(recoveryKey); } catch (_) {}
              observer.disconnect();
            }
          }).observe(root, { childList: true, subtree: true });
        }

        // Module graph and hashed asset failures may surface only as a resource
        // error in installed Safari rather than a normal Error object.
        window.addEventListener("error", function (e) {
          var target = e.target;
          var isScript = target && target.tagName === "SCRIPT";
          var isStylesheet = target && target.tagName === "LINK" && target.rel === "stylesheet";
          var assetUrl = target && (target.src || target.href);
          var isSameOrigin = false;
          try { isSameOrigin = !!assetUrl && new URL(assetUrl, location.href).origin === location.origin; } catch (_) {}
          var isBootAsset = isSameOrigin && (isScript || isStylesheet);
          if (bootIsPending() && (isBootAsset || e.message)) {
            recoverOnce(isBootAsset ? "startup_asset_load" : "startup_exception");
          }
        }, true);

        window.addEventListener("unhandledrejection", function (e) {
          if (bootIsPending()) recoverOnce("startup_rejection");
        });

        // Safari does not reliably dispatch an error when an installed PWA's
        // stale module graph cannot finish loading. Never wait forever.
        setTimeout(function () {
          if (bootIsPending()) recoverOnce("startup_timeout");
        }, bootTimeoutMs);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
